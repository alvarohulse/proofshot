name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg tmux

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/bin/proofshot.js
          test -f dist/src/index.js
          node dist/bin/proofshot.js --help
          npm pack --dry-run

      - name: Run tests
        run: npm test

      - name: Run FFmpeg integration test
        run: npm run test:ffmpeg
